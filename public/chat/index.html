<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1677ff">
  <title>AI Desk — Chat</title>
  <style>
    :root{--blue-950:#082b5c;--blue-900:#0b458f;--blue-700:#1677ff;--blue-500:#45a3ff;--blue-100:#e9f4ff;--ink:#19324d;--muted:#6d8299;--line:#dceafa}
    *{box-sizing:border-box}body{min-height:100vh;margin:0;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 8% 5%,#bfe6ff 0,transparent 28%),linear-gradient(135deg,#edf8ff,#f7fbff 52%,#e3f1ff)}a{color:inherit}.page{width:min(1040px,100%);margin:auto;padding:24px 20px 30px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.back-link{color:var(--blue-900);font-size:14px;font-weight:700;text-decoration:none}.brand{display:flex;align-items:center;gap:10px;color:var(--blue-950);font-size:15px;font-weight:800}.brand-mark{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;color:#fff;font-size:20px;background:linear-gradient(145deg,var(--blue-700),var(--blue-500));box-shadow:0 8px 18px #1677ff40}.shell{overflow:hidden;border:1px solid #fff;border-radius:24px;background:#ffffffcc;box-shadow:0 24px 70px #276da51c;backdrop-filter:blur(14px)}.hero{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:30px 32px;color:#fff;background:linear-gradient(115deg,#0b4ea2,#1677ff 55%,#36a5ff)}.hero h1{margin:0 0 7px;font-size:clamp(24px,4vw,34px);letter-spacing:-.7px}.hero p{margin:0;color:#dcefff;font-size:14px}.hero-icon{display:grid;width:76px;height:76px;place-items:center;border:1px solid #ffffff45;border-radius:24px;font-size:39px;background:#ffffff20}.workspace{padding:20px;background:linear-gradient(180deg,#fafdff,#f4f9ff)}.settings{display:grid;grid-template-columns:minmax(180px,1fr) minmax(220px,1.3fr);gap:12px;margin-bottom:16px}.field{display:flex;align-items:center;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:13px;background:#fff;box-shadow:0 5px 15px #3d83b80d}.field-icon{color:var(--blue-700);font-size:18px}label{width:1px;height:1px;overflow:hidden;position:absolute;clip:rect(0,0,0,0)}select,input,textarea{width:100%;border:0;outline:0;color:var(--ink);font:inherit;background:transparent}select,input{min-width:0;font-size:14px;font-weight:650}.messages{display:flex;min-height:430px;max-height:56vh;flex-direction:column;gap:14px;overflow-y:auto;padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,#fff,#f8fcff);scroll-behavior:smooth}.empty-state{display:grid;min-height:380px;place-content:center;justify-items:center;padding:20px;color:var(--muted);text-align:center}.empty-icon{display:grid;width:72px;height:72px;place-items:center;margin-bottom:14px;border-radius:22px;color:var(--blue-700);font-size:34px;background:var(--blue-100)}.empty-state strong{color:var(--blue-900);font-size:18px}.empty-state p{max-width:360px;margin:7px 0 0;font-size:14px;line-height:1.6}.message-row{display:flex;align-items:flex-end;gap:10px;animation:appear .22s ease-out}.message-row.user{flex-direction:row-reverse}.avatar{display:grid;width:34px;height:34px;flex:0 0 34px;place-items:center;border-radius:12px;font-size:17px;background:var(--blue-100)}.user .avatar{color:#fff;background:linear-gradient(145deg,var(--blue-700),var(--blue-500))}.bubble{max-width:min(76%,680px);padding:12px 15px;border:1px solid var(--line);border-radius:17px 17px 17px 5px;color:var(--ink);white-space:pre-wrap;line-height:1.6;font-size:14px;background:#fff;box-shadow:0 5px 14px #3d83b80d}.user .bubble{border:0;border-radius:17px 17px 5px 17px;color:#fff;background:linear-gradient(135deg,#1169df,#2999f8);box-shadow:0 8px 18px #1677ff2e}.typing .bubble{color:var(--blue-700);font-size:19px;letter-spacing:3px}.composer{display:flex;align-items:flex-end;gap:10px;margin-top:14px;padding:10px 10px 10px 15px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 7px 20px #3d83b812}textarea{min-height:44px;max-height:130px;resize:none;padding:10px 0;line-height:1.5}textarea::placeholder{color:#9aafc2}.send-button{display:inline-flex;align-items:center;gap:7px;height:44px;padding:0 18px;border:0;border-radius:12px;color:#fff;font:inherit;font-weight:800;background:linear-gradient(135deg,var(--blue-700),#35a2ff);box-shadow:0 7px 15px #1677ff38;cursor:pointer;transition:.15s}.send-button:hover{transform:translateY(-1px)}.send-button:disabled{opacity:.6;cursor:wait}.hint{margin:10px 3px 0;color:var(--muted);font-size:12px}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@media(max-width:620px){.page{padding:14px 10px 20px}.brand{font-size:13px}.brand-mark{width:32px;height:32px;font-size:17px}.hero{padding:24px 20px}.hero-icon{width:58px;height:58px;border-radius:18px;font-size:29px}.workspace{padding:12px}.settings{grid-template-columns:1fr;gap:8px}.messages{min-height:52vh;max-height:60vh;padding:14px 10px}.bubble{max-width:84%}.send-button{padding:0 14px}.send-label{display:none}}
  </style>
</head>
<body><main class="page"><nav class="topbar"><a class="back-link" href="/">← กลับหน้าหลัก</a><div class="brand"><span class="brand-mark">✦</span><span>AI Desk Assistant</span></div></nav><section class="shell"><header class="hero"><div><h1>คุยกับผู้ช่วย AI</h1><p>เลือกผู้ให้บริการ แล้วเริ่มบทสนทนาได้ทันที</p></div><div class="hero-icon" aria-hidden="true">🤖</div></header><div class="workspace"><div class="settings"><div class="field"><span class="field-icon">⚡</span><label for="provider">ผู้ให้บริการ</label><select id="provider" title="เลือกผู้ให้บริการ"><option value="gemini">Google Gemini</option><option value="openai">OpenAI</option><option value="openai-compat">Custom gateway</option></select></div><div class="field"><span class="field-icon">◈</span><label for="model">โมเดล</label><input id="model" placeholder="เว้นว่างเพื่อใช้ค่าเริ่มต้น" autocomplete="off"></div></div><div id="messages" class="messages" aria-live="polite"><div class="empty-state" id="empty-state"><div class="empty-icon">💬</div><strong>พร้อมช่วยเหลือคุณแล้ว</strong><p>ถามคำถาม ขอไอเดีย หรือให้ช่วยงานต่าง ๆ ได้เลย</p></div></div><form id="form" class="composer"><label for="message">ข้อความ</label><textarea id="message" rows="1" placeholder="พิมพ์ข้อความของคุณที่นี่..." aria-label="ข้อความ" required></textarea><button class="send-button" type="submit"><span>➤</span><span class="send-label">ส่งข้อความ</span></button></form><p class="hint">กด Enter เพื่อส่ง · Shift + Enter เพื่อขึ้นบรรทัดใหม่</p></div></section></main><script src="/chat/app.js"></script></body></html>
